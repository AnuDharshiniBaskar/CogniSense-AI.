<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CogniSense AI — Host dashboard</title>
<style>
body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:#f6f7fb;color:#1c2c45;margin:0;padding:28px}
.wrap{max-width:1000px;margin:auto}
h1{font-size:24px;margin:0 0 6px}
.muted{color:#6b7385;font-size:14px;margin:0 0 20px}
.card{background:#fff;border:1px solid #e6e9f2;border-radius:14px;padding:20px;margin-bottom:18px}
input,select,button{font:inherit;padding:11px 14px;border-radius:10px;border:1px solid #d8dded}
button{background:#5b4fe0;color:#fff;border:0;font-weight:600;cursor:pointer}
button.ghost{background:#fff;color:#1c2c45;border:1px solid #d8dded}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.err{color:#d6453d;font-size:14px;min-height:20px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eceef6}
th{color:#6b7385;font-weight:600;font-size:13px}
.empty{text-align:center;color:#6b7385;padding:22px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Host dashboard</h1>
  <p class="muted">Player names and results. Only visible on this page.</p>

  <div class="card" id="gate">
    <div class="row">
      <input id="pin" type="password" placeholder="Host PIN">
      <button id="unlock">Unlock</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div id="board" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <strong>Who played</strong>
        <button class="ghost" id="refresh">Refresh</button>
      </div>
      <table>
        <thead><tr><th>Name</th><th>Rounds</th><th>Correct</th><th>Points</th></tr></thead>
        <tbody id="summary"></tbody>
      </table>
    </div>
    <div class="card">
      <strong>All rounds</strong>
      <table style="margin-top:12px">
        <thead><tr><th>Name</th><th>Game</th><th>Difficulty</th><th>Result</th><th>Points</th><th>Detail</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let pin = '';
const GAME_NAMES = {sequence:'Number sequence',stroop:'Colour focus',words:'Word recall',shape:'Shape memory',grid:'Pattern grid',math:'Quick Maths',oddone:'Odd One Out',sequencepattern:'Pattern Detective',react:'Reaction time'};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load() {
  const r = await fetch('/api/history?limit=500', { headers: { 'X-Host-Pin': pin } });
  if (r.status === 403) return false;
  const rows = await r.json();

  const people = {};
  rows.forEach(x => {
    const p = people[x.participant] ||= { rounds: 0, correct: 0, points: 0 };
    p.rounds++; p.correct += x.correct; p.points += x.points;
  });
  const names = Object.keys(people).sort((a, b) => people[b].points - people[a].points);
  $('summary').innerHTML = names.length ? names.map(n => `<tr><td>${esc(n)}</td><td>${people[n].rounds}</td><td>${people[n].correct}</td><td>${people[n].points}</td></tr>`).join('')
    : '<tr><td colspan="4" class="empty">No results yet.</td></tr>';

  $('rows').innerHTML = rows.length ? rows.map(x => `<tr>
    <td>${esc(x.participant)}</td><td>${esc(GAME_NAMES[x.game] || x.game)}</td><td>${esc(x.difficulty)}</td>
    <td>${x.correct ? 'Correct' : 'Wrong'}</td><td>${x.points}</td><td>${esc(x.detail)}</td></tr>`).join('')
    : '<tr><td colspan="6" class="empty">No results yet.</td></tr>';
  return true;
}

$('unlock').addEventListener('click', async () => {
  pin = $('pin').value;
  const ok = await load().catch(() => false);
  if (ok) { $('gate').classList.add('hidden'); $('board').classList.remove('hidden'); $('err').textContent = ''; }
  else $('err').textContent = 'Wrong PIN or server not reachable.';
});
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('unlock').click(); });
$('refresh').addEventListener('click', load);
</script>
</body>
</html>
