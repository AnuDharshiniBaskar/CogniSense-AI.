<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CogniSense AI | Host</title>
<style>
  :root { --ink:#1f2330; --muted:#6b7080; --line:#e6e8ef; --bg:#fafbfd; --accent:#5b4fe0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:960px; margin:0 auto; padding:32px 20px; }
  h1 { font-size:26px; margin:0 0 6px; }
  .muted { color:var(--muted); font-size:14px; margin:0 0 20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:24px; }
  .gate { display:grid; gap:10px; max-width:340px; }
  input { font:inherit; padding:11px 14px; border:1px solid var(--line); border-radius:10px; }
  button { font:inherit; padding:11px 16px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .err { color:#d6453d; font-size:14px; min-height:20px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  .empty { text-align:center; color:var(--muted); padding:24px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Host dashboard</h1>
  <p class="muted">Player names and results. Only visible here.</p>

  <div class="card" id="gate">
    <div class="gate">
      <input id="pin" type="password" placeholder="Host PIN">
      <button id="unlock">Unlock</button>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div class="card hidden" id="board">
    <div class="row">
      <strong>All sessions</strong>
      <button class="ghost" id="refresh">Refresh</button>
    </div>
    <table>
      <thead><tr><th>Name</th><th>Task</th><th>Difficulty</th><th>Score</th><th>Avg. time</th><th>Workload</th><th>When</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let pin = '';
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  async function load() {
    const r = await fetch('/api/history?limit=200', { headers: { 'X-Host-Pin': pin } });
    if (r.status === 403) return false;
    const rows = await r.json();
    $('rows').innerHTML = rows.length ? rows.map(x => `<tr>
      <td>${esc(x.participant)}</td><td>${esc(x.task_type)}</td><td>${esc(x.difficulty)}</td>
      <td>${Math.round(Number(x.accuracy))}%</td><td>${(Number(x.avg_response_ms)/1000).toFixed(2)}s</td>
      <td>${esc(x.workload)}</td><td>${esc(x.created_at)}</td></tr>`).join('')
      : '<tr><td colspan="7" class="empty">No sessions yet.</td></tr>';
    return true;
  }

  $('unlock').addEventListener('click', async () => {
    pin = $('pin').value;
    const ok = await load().catch(() => false);
    if (ok) { $('gate').classList.add('hidden'); $('board').classList.remove('hidden'); $('err').textContent = ''; }
    else $('err').textContent = 'Wrong PIN or server not reachable.';
  });
  $('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('unlock').click(); });
  $('refresh').addEventListener('click', load);
</script>
</body>
</html>
